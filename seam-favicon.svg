<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="bounds">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0F1117"/>

  <!-- Top-left triangle (lighter surface) — line anchored bottom-left, top floating -->
  <polygon points="0,0 24,0 0,32" fill="#181C27" clip-path="url(#bounds)"/>

  <!-- Seam line — bottom end at bottom-left corner, top end floating -->
  <line x1="-1" y1="33" x2="25" y2="-1" stroke="#2A2F42" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="32" x2="24" y2="0" stroke="#4A7CFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Border -->
  <rect width="32" height="32" rx="6" fill="none" stroke="#2A2F42" stroke-width="1"/>
</svg>
